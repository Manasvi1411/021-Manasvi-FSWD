<!DOCTYPE html>
<html>
<head>
    <title>Internship Details</title>

    <style>
        table {
            width: 80%;
            margin: 50px auto;
            border-collapse: collapse;
            text-align: center;
            font-family: Arial, sans-serif;
        }

        th, td {
            border: 1px solid black;
            padding: 10px;
        }

        th {
            background-color: #dbe5f1;
            font-weight: bold;
        }

        .duration {
            background-color: #e2f0d9;
        }

        .period {
            background-color: #fff2cc;
        }

        .performance {
            background-color: #f4cccc;
        }

        td {
            height: 40px;
        }
    </style>
</head>

<body>

    <table>
        <tr>
            <th rowspan="2">Sr.no</th>
            <th rowspan="2">Details of internship</th>
            <th rowspan="2" class="duration">Duration (months)</th>
            <th colspan="2" class="period">Internship period</th>
            <th colspan="3" class="performance">Internship performance details</th>
        </tr>

        <tr>
            <th class="period">From</th>
            <th class="period">To</th>
            <th class="performance">S.no</th>
            <th class="performance">Skill gained</th>
            <th class="performance">Mentor remarks</th>
        </tr>

        <tr>
            <td rowspan="2">1</td>
            <td rowspan="2"></td>
            <td rowspan="2"></td>
            <td rowspan="2"></td>
            <td rowspan="2"></td>
            <td>1</td>
            <td></td>
            <td></td>
        </tr>

        <tr>
            <td>2</td>
            <td></td>
            <td></td>
        </tr>

        <tr>
            <td rowspan="2">2</td>
            <td rowspan="2"></td>
            <td rowspan="2"></td>
            <td rowspan="2"></td>
            <td rowspan="2"></td>
            <td>1</td>
            <td></td>
            <td></td>
        </tr>

        <tr>
            <td>2</td>
            <td></td>
            <td></td>
        </tr>
    </table>

</body>
</html>
