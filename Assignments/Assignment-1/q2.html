<!DOCTYPE html>
<html>
<head>
    <title>Student Marks</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f2f2f2;
            text-align: center;
        }

        .container {
            width: 400px;
            margin: 50px auto;
            padding: 25px;
            background-color: white;
            border-radius: 10px;
            box-shadow: 0 0 10px gray;
        }

        input {
            width: 80%;
            padding: 10px;
            margin: 8px;
        }

        button {
            padding: 10px 20px;
            margin: 15px;
            cursor: pointer;
        }

        #result {
            margin-top: 20px;
            font-size: 18px;
        }

        .error {
            color: red;
        }
    </style>
</head>

<body>

    <div class="container">

        <h1>Student Marks</h1>

        <input type="number" id="mark1" placeholder="Subject 1 Marks">
        <input type="number" id="mark2" placeholder="Subject 2 Marks">
        <input type="number" id="mark3" placeholder="Subject 3 Marks">
        <input type="number" id="mark4" placeholder="Subject 4 Marks">
        <input type="number" id="mark5" placeholder="Subject 5 Marks">

        <br>

        <button onclick="calculateResult()">Calculate Result</button>

        <div id="result"></div>

    </div>

    <script>
        function calculateResult() {

            let marks = [
                Number(document.getElementById("mark1").value),
                Number(document.getElementById("mark2").value),
                Number(document.getElementById("mark3").value),
                Number(document.getElementById("mark4").value),
                Number(document.getElementById("mark5").value)
            ];

            // Validate marks
            for (let i = 0; i < marks.length; i++) {

                if (marks[i] < 0 || marks[i] > 100 || isNaN(marks[i])) {
                    document.getElementById("result").innerHTML =
                        "<p class='error'>Error: Each mark must be between 0 and 100.</p>";
                    return;
                }
            }

            let total = 0;

            for (let i = 0; i < marks.length; i++) {
                total += marks[i];
            }

            let percentage = total / 5;

            let grade;

            if (percentage >= 90) {
                grade = "A+";
            } 
            else if (percentage >= 80) {
                grade = "A";
            } 
            else if (percentage >= 70) {
                grade = "B";
            } 
            else if (percentage >= 60) {
                grade = "C";
            } 
            else if (percentage >= 50) {
                grade = "D";
            } 
            else {
                grade = "F";
            }

            let result;

            if (marks.some(mark => mark < 35)) {
                result = "Fail";
            } 
            else {
                result = "Pass";
            }

            document.getElementById("result").innerHTML =
                "<p><b>Total:</b> " + total + " / 500</p>" +
                "<p><b>Percentage:</b> " + percentage.toFixed(2) + "%</p>" +
                "<p><b>Grade:</b> " + grade + "</p>" +
                "<p><b>Result:</b> " + result + "</p>";
        }
    </script>

</body>
</html>
