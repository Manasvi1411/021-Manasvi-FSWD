<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Question 1 - Employee List with Conditional Styling</title>

    <!-- React 18 & Babel CDN -->
    <script crossorigin src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: #f4f6f9;
            color: #333;
            padding: 40px 20px;
        }

        .container {
            max-width: 900px;
            margin: 0 auto;
            background: #ffffff;
            border-radius: 12px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.08);
            padding: 30px;
        }

        header {
            text-align: center;
            margin-bottom: 25px;
            border-bottom: 2px solid #eef2f7;
            padding-bottom: 20px;
        }

        header h1 {
            color: #1a365d;
            font-size: 26px;
            margin-bottom: 8px;
        }

        header p {
            color: #64748b;
            font-size: 14px;
        }

        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 15px;
            margin-bottom: 25px;
        }

        .stat-card {
            background: #f8fafc;
            border: 1px solid #e2e8f0;
            border-radius: 8px;
            padding: 15px;
            text-align: center;
        }

        .stat-card h3 {
            font-size: 13px;
            text-transform: uppercase;
            color: #64748b;
            margin-bottom: 6px;
        }

        .stat-card .value {
            font-size: 22px;
            font-weight: bold;
            color: #0f172a;
        }

        .stat-card.highlight {
            background: #ecfdf5;
            border-color: #a7f3d0;
        }

        .stat-card.highlight .value {
            color: #047857;
        }

        .table-responsive {
            overflow-x: auto;
            border-radius: 8px;
            border: 1px solid #e2e8f0;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            text-align: left;
        }

        thead {
            background-color: #1e293b;
            color: #ffffff;
        }

        th {
            padding: 14px 16px;
            font-size: 14px;
            font-weight: 600;
            letter-spacing: 0.5px;
        }

        td {
            padding: 14px 16px;
            font-size: 14px;
            border-bottom: 1px solid #e2e8f0;
        }

        /* Default row */
        .row-normal {
            background-color: #ffffff;
            transition: background-color 0.2s ease;
        }

        .row-normal:hover {
            background-color: #f8fafc;
        }

        /* Highlighted row for salary > 50000 */
        .row-highlighted {
            background-color: #d1fae5 !important;
            font-weight: 600;
            color: #065f46;
            transition: background-color 0.2s ease;
        }

        .row-highlighted:hover {
            background-color: #a7f3d0 !important;
        }

        .badge {
            display: inline-block;
            padding: 4px 10px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 600;
        }

        .badge-high {
            background-color: #059669;
            color: #ffffff;
        }

        .badge-normal {
            background-color: #e2e8f0;
            color: #475569;
        }

        .legend {
            display: flex;
            align-items: center;
            justify-content: flex-end;
            gap: 15px;
            margin-top: 15px;
            font-size: 13px;
            color: #475569;
        }

        .legend-indicator {
            display: inline-block;
            width: 14px;
            height: 14px;
            border-radius: 3px;
            margin-right: 6px;
            vertical-align: middle;
        }

        .indicator-high {
            background-color: #d1fae5;
            border: 1px solid #059669;
        }

        .indicator-normal {
            background-color: #ffffff;
            border: 1px solid #cbd5e1;
        }
    </style>
</head>
<body>

    <div id="root"></div>

    <script type="text/babel">
        const { useState } = React;

        // Employee component demonstrating map(), key prop, and conditional styling
        function EmployeeTableApp() {
            // Array of employee objects: id, name, department, salary
            const [employees] = useState([
                { id: 101, name: "Alice Johnson", department: "Engineering", salary: 75000 },
                { id: 102, name: "Bob Smith", department: "Marketing", salary: 45000 },
                { id: 103, name: "Charlie Brown", department: "Human Resources", salary: 52000 },
                { id: 104, name: "Diana Prince", department: "Product Design", salary: 68000 },
                { id: 105, name: "Evan Wright", department: "Sales", salary: 42000 },
                { id: 106, name: "Fiona Gallagher", department: "Finance", salary: 81000 },
                { id: 107, name: "George Clark", department: "Operations", salary: 49000 },
                { id: 108, name: "Hannah Abbott", department: "Engineering", salary: 56000 }
            ]);

            // Threshold for conditional highlighting
            const SALARY_THRESHOLD = 50000;

            // Calculations for summary stats
            const totalEmployees = employees.length;
            const highSalaryEmployees = employees.filter(emp => emp.salary > SALARY_THRESHOLD).length;
            const averageSalary = Math.round(
                employees.reduce((acc, curr) => acc + curr.salary, 0) / totalEmployees
            );

            // Inline styles for conditional styling
            const highSalaryStyle = {
                backgroundColor: "#d1fae5",
                color: "#065f46",
                fontWeight: "600"
            };

            const normalSalaryStyle = {
                backgroundColor: "#ffffff",
                color: "#334155"
            };

            return (
                <div className="container">
                    <header>
                        <h1>Employee Directory</h1>
                        <p>Rendered using React <code>map()</code> with <code>key</code> & conditional styling for salary &gt; ₹50,000</p>
                    </header>

                    {/* Summary Statistics */}
                    <div className="stats-grid">
                        <div className="stat-card">
                            <h3>Total Employees</h3>
                            <div className="value">{totalEmployees}</div>
                        </div>
                        <div className="stat-card highlight">
                            <h3>Salary &gt; ₹50,000</h3>
                            <div className="value">{highSalaryEmployees}</div>
                        </div>
                        <div className="stat-card">
                            <h3>Average Salary</h3>
                            <div className="value">₹{averageSalary.toLocaleString()}</div>
                        </div>
                    </div>

                    {/* Employee Table */}
                    <div className="table-responsive">
                        <table>
                            <thead>
                                <tr>
                                    <th>ID</th>
                                    <th>Employee Name</th>
                                    <th>Department</th>
                                    <th>Salary (₹)</th>
                                    <th>Status</th>
                                </tr>
                            </thead>
                            <tbody>
                                {/* Rendering array of employee objects with map() and key */}
                                {employees.map((employee) => {
                                    const isAbove50k = employee.salary > SALARY_THRESHOLD;

                                    return (
                                        <tr
                                            key={employee.id}
                                            style={isAbove50k ? highSalaryStyle : normalSalaryStyle}
                                            className={isAbove50k ? "row-highlighted" : "row-normal"}
                                        >
                                            <td>#{employee.id}</td>
                                            <td>{employee.name}</td>
                                            <td>{employee.department}</td>
                                            <td>₹{employee.salary.toLocaleString()}</td>
                                            <td>
                                                {isAbove50k ? (
                                                    <span className="badge badge-high">High Salary (&gt; 50k)</span>
                                                ) : (
                                                    <span className="badge badge-normal">Standard</span>
                                                )}
                                            </td>
                                        </tr>
                                    );
                                })}
                            </tbody>
                        </table>
                    </div>

                    {/* Table Legend */}
                    <div className="legend">
                        <span>
                            <span className="legend-indicator indicator-high"></span>
                            Salary &gt; ₹50,000 (Highlighted)
                        </span>
                        <span>
                            <span className="legend-indicator indicator-normal"></span>
                            Salary &le; ₹50,000 (Standard)
                        </span>
                    </div>
                </div>
            );
        }

        // Mount React application
        const root = ReactDOM.createRoot(document.getElementById("root"));
        root.render(<EmployeeTableApp />);
    </script>
</body>
</html>
