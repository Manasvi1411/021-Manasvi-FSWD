<!DOCTYPE html>
<html>
<head>
    <title>Student Registration Form</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <h1>Student Registration Form</h1>

    <nav>
        <a href="personal.html">Personal Info</a>
        <a href="education.html" class="active">Education</a>
    </nav>

    <form>

        <h2>Education Details</h2>

        <fieldset>

            <legend>10th / Secondary Education</legend>

            <label for="school10">School Name:</label>
            <input type="text" id="school10"
                   name="school10" required>

            <br><br>

            <label for="percentage10">Percentage:</label>
            <input type="number"
                   id="percentage10"
                   name="percentage10"
                   min="0"
                   max="100"
                   step="0.01"
                   required>

            <br><br>

            <label for="year10">Year of Passing:</label>
            <input type="number"
                   id="year10"
                   name="year10"
                   required>

        </fieldset>

        <br>

        <fieldset>

            <legend>12th / Intermediate</legend>

            <label for="college12">College Name:</label>
            <input type="text"
                   id="college12"
                   name="college12"
                   required>

            <br><br>

            <label for="percentage12">Percentage:</label>
            <input type="number"
                   id="percentage12"
                   name="percentage12"
                   min="0"
                   max="100"
                   step="0.01"
                   required>

            <br><br>

            <label for="year12">Year of Passing:</label>
            <input type="number"
                   id="year12"
                   name="year12"
                   required>

        </fieldset>

        <br>

        <fieldset>

            <legend>Degree</legend>

            <label for="degree">Degree:</label>

            <select id="degree" name="degree" required>
                <option value="">-- Select Degree --</option>
                <option value="btech">B.Tech</option>
                <option value="be">B.E</option>
                <option value="bsc">B.Sc</option>
                <option value="bca">BCA</option>
                <option value="bcom">B.Com</option>
                <option value="ba">B.A</option>
                <option value="bba">BBA</option>
                <option value="other">Other</option>
            </select>

            <br><br>

            <label for="university">University Name:</label>
            <input type="text"
                   id="university"
                   name="university"
                   required>

            <br><br>

            <label for="cgpa">CGPA:</label>
            <input type="number"
                   id="cgpa"
                   name="cgpa"
                   min="0"
                   max="10"
                   step="0.01"
                   required>

            <br><br>

            <label for="yearDegree">Year of Passing:</label>
            <input type="number"
                   id="yearDegree"
                   name="yearDegree"
                   required>

        </fieldset>

        <br>

        <fieldset>

            <legend>Skills</legend>

            <label for="problemSolving">
                Problem Solving:
            </label>

            <input type="range"
                   id="problemSolving"
                   name="problemSolving"
                   min="0"
                   max="100"
                   value="50">

            <br><br>

            <label for="communication">
                Communication:
            </label>

            <input type="range"
                   id="communication"
                   name="communication"
                   min="0"
                   max="100"
                   value="50">

            <br><br>

            <label for="programming">
                Programming:
            </label>

            <input type="range"
                   id="programming"
                   name="programming"
                   min="0"
                   max="100"
                   value="50">

            <br><br>

            <label for="skills">Other Skills:</label>

            <input type="text"
                   id="skills"
                   name="skills"
                   placeholder="Java, Python, SQL">

        </fieldset>

        <br>

        <fieldset>

            <legend>Additional Information</legend>

            <label for="certifications">
                Certifications:
            </label>

            <textarea id="certifications"
                      name="certifications"
                      rows="3"
                      placeholder="Enter your certifications"></textarea>

            <br><br>

            <label for="achievements">
                Achievements:
            </label>

            <textarea id="achievements"
                      name="achievements"
                      rows="3"
                      placeholder="Enter your achievements"></textarea>

            <br><br>

            <label for="resume">Resume:</label>

            <input type="file"
                   id="resume"
                   name="resume"
                   accept=".pdf,.doc,.docx">

        </fieldset>

        <br>

        <button type="submit">Register</button>

    </form>

</body>
</html>
